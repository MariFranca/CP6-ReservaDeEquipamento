spring.application.name=reserva-equipamentos

# ============================================================
# BANCO DE DADOS - PERFIL PADRAO (H2 em memoria)
# ============================================================
# Ideal para desenvolvimento e para rodar os testes/Insomnia
# sem precisar de nenhuma instalacao adicional.

spring.datasource.url=jdbc:h2:mem:reservas
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Garante que o data.sql (dados de exemplo) só seja executado depois que
# o Hibernate criar as tabelas via ddl-auto.
spring.jpa.defer-datasource-initialization=true

# Console H2 -> http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
